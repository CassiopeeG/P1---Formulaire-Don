<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="script" href="main.ts" defer />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire de don</title>
  </head>
  <body class="m-auto flex flex-col items-center justify-center">
    <div class="p-4 center">
      <img src="" alt="Ecosia" />
    </div>

    <div class="bg-lime-800 w-screen m-2">
      <h1 class="text-4xl font-bold m-10 text-center text-white">
        Faire un don
      </h1>
    </div>

    <main class="w-screen">
      <!------------------------ Début du formulaire ------------------------>
      <form action="merci.html" method="get" class="bg-white p-3">
        <!-- Navigateur de sections -->
        <nav aria-label="Étapes du formulaire de don">
          <!-- <ol class="flex justify-center gap-3 max-w-screen"> -->
          <ol class="flex justify-center items-center gap-2">
            <li class="w-10">
              <span class="sr-only">Lien Étape 0 - Montant</span>
              <a href="" id="navEtapes_etape0">
                <span><img src="./public/montant.svg" alt="" /></span>
              </a>
            </li>
            <span><img src="./public/fleche.svg" alt="" /></span>
            <li class="w-10">
              <span class="sr-only">Lien Étape 1 - Coordonnées</span>
              <a href="" id="navEtapes_etape1">
                <span><img src="./public/information.svg" alt="" /></span>
              </a>
            </li>
            <span><img src="./public/fleche.svg" alt="" /></span>
            <li class="w-10">
              <span class="sr-only">Lien Étape 2 - Paiement</span>
              <a href="" id="navEtapes_etape2">
                <span><img src="./public/paiement.svg" alt="" /></span>
              </a>
            </li>
            <span><img src="./public/fleche.svg" alt="" /></span>
            <li class="w-10">
              <span class="sr-only">Lien Étape 3 - Validation</span>
              <a href="" id="navEtapes_etape3">
                <span><img src="./public/validation.svg" alt="" /></span>
              </a>
            </li>
          </ol>
        </nav>

        <!------------- Première Section: Montant du don ------------->
        <div id="section0">
          <h2 class="text-2xl font-bold m-4 text-center">Montant du don</h2>

          <!-- Choix bouton radio type de versement -->
          <fieldset
            class="min-w-72 px-2 py-3 bg-grisPale rounded-[20px] inline-flex justify-center items-center gap-1.5 flex-wrap content-center"
            role="radiogroup"
            aria-required="true"
            aria-invalid="false"
            aria-describedby="err_versement"
          >
            <legend class="font-bold mb-1">Type de versement</legend>
            <input
              class="w-0"
              type="radio"
              required
              aria-invalid="false"
              id="versementUnique"
              name="versement"
              value="versementUnique"
            /><label
              for="versementUnique"
              class="flex-1 p-2.5 bg-neutral-200 rounded-[10px] outline outline-1 outline-offset-[-1px] outline-zinc-800 flex justify-center items-center gap-1.5"
              >Unique</label
            ><br />

            <input
              class="w-0"
              type="radio"
              aria-invalid="false"
              id="versementMensuel"
              name="versement"
              value="versementMensuel"
            /><label
              for="versementMensuel"
              class="flex-1 p-2.5 bg-neutral-200 rounded-[10px] outline outline-1 outline-offset-[-1px] outline-zinc-800 flex justify-center items-center gap-1.5"
              >Mensuel</label
            ><br />

            <input
              class="w-0"
              type="radio"
              aria-invalid="false"
              id="versementAnnuel"
              name="versement"
              value="versementAnnuel"
            /><label
              for="versementAnnuel"
              class="flex-1 p-2.5 bg-neutral-200 rounded-[10px] outline outline-1 outline-offset-[-1px] outline-zinc-800 flex justify-center items-center gap-2.5"
              >Annuel</label
            ><br />
            <span class="err err_versement" role="alert"></span>
          </fieldset>

          <div class="my-3 px-2.5 py-3 bg-grisPale rounded-[20px] hidden flex gap-2">
            <img src="./public/boxInfo-icon.svg" alt="" class="w-5 self-start" />
            <p id="p-infoVersement"></p>
          </div>

          <!-- Choix montant -->
          <fieldset
            class="min-w-72 mb-3 px-2 py-3 bg-grisPale rounded-[20px] inline-flex justify-center items-center gap-1.5 flex-wrap content-center"
            role="radiogroup"
            aria-required="true"
            aria-invalid="false"
            aria-describedby="err_montant"
          >
            <legend class="font-bold mb-1">Montant</legend>
            <input
              type="radio"
              required
              aria-describedby="err_montant20"
              aria-invalid="false"
              id="montant20"
              name="montant"
              value="20"
            /><label for="montant20">20$</label><br />

            <input
              type="radio"
              aria-describedby="err_montant50"
              aria-invalid="false"
              id="montant50"
              name="montant"
              value="50"
            /><label for="montant50">50$</label><br />

            <input
              type="radio"
              aria-describedby="err_montant100"
              aria-invalid="false"
              id="montant100"
              name="montant"
              value="100"
            /><label for="montant100">100$</label><br />

            <input
              type="radio"
              aria-describedby="err_montant200"
              aria-invalid="false"
              id="montant200"
              name="montant"
              value="200"
            /><label for="montant200">200$</label><br />

            <input
              class="sr-only"
              type="radio"
              aria-describedby="err_montantPersonnalise"
              aria-invalid="false"
              id="montantPersonnalise"
              name="montant"
            /><label for="montantPersonnalise" class="sr-only"
              >Personnalisé:
            </label>
            <span class="err err_montantPersonnalise err_montantPerso"></span>
            <br />

            <input
              class="border-2 border-black-500"
              type="number"
              id="montantPerso"
              name="montantPerso"
              min="000000"
              max="999999"
              size="6"
              required
              step="0.01"
              title="Veuillez confirmer votre montant"
              aria-invalid="false"
            />
            <br />
            <span class="err err_montant" role="alert"></span>
          </fieldset>

          <button
            type="button"
            id="etape0"
            class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded transition duration-200"
          >
            Suivant
          </button>
        </div>

        <!------------- Deuxième Section: Coordonnées du donneur ------------->
        <div id="section1">
          <h2 class="text-2xl font-bold m-4 text-center">
            Coordonnées du donneur
          </h2>
          <fieldset class="border-2 border-black-500 p-2 flex flex-col gap-3">
            <div class="flex flex-col mb-2">
              <!-- Nom -->
              <label for="nom">Nom</label>
              <input
                class="border-2 border-black-500 p-2"
                type="text"
                id="nom"
                name="nom"
                required
                aria-required="true"
                aria-describedby="err_nom"
                aria-invalid="false"
                autocomplete="family-name"
                pattern="^[[\p{L}\s'\-]+]{2,}$"
                title="Lettres, espaces, tirets, accents et guillemet simple autorisés. Chiffres et charactères spéciaux non-autorisés"
              />
              <span class="err err_nom" role="alert"></span>
            </div>

            <div class="flex flex-col mb-2">
              <!-- Prenom -->
              <label for="prenom">Prenom</label>
              <input
                class="border-2 border-black-500 p-2"
                type="text"
                id="prenom"
                name="prenom"
                required
                aria-required="true"
                aria-describedby="err_prenom"
                aria-invalid="false"
                autocomplete="given-name"
                pattern="^[[\p{L}\s'\-]+]{2,}$"
                title="Lettres, espaces, tirets, accents et guillemet simple autorisés. Chiffres et charactères spéciaux non-autorisés"
              />
              <span class="err err_prenom" role="alert"></span>
            </div>

            <div class="flex flex-col mb-2">
              <!-- Email -->
              <label for="email">Email</label>
              <input
                class="border-2 border-black-500 p-2"
                type="email"
                id="email"
                name="email"
                required
                aria-required="true"
                aria-describedby="err_email"
                aria-invalid="false"
                autocomplete="email"
                pattern="(\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+)"
                title="format email"
              />
              <span class="err err_email" role="alert"></span>
            </div>

            <div class="flex flex-col mb-2">
              <!-- Téléphone -->
              <label for="telephone">Téléphone</label>
              <input
                class="border-2 border-black-500 p-2"
                type="tel"
                id="telephone"
                name="telephone"
                required
                aria-required="true"
                aria-describedby="err_telephone"
                aria-invalid="false"
                autocomplete="tel"
                pattern="[0-9]{3} [0-9]{3}-[0-9]{4}"
              />
              <span class="err err_telephone" role="alert"></span>
            </div>
          </fieldset>

          <fieldset class="border-2 border-black-500 p-2 flex flex-col gap-3">
            <label for="adresse">Adresse</label>
            <input
              class="border-2 border-black-500 p-2"
              type="text"
              id="adresse"
              name="adresse"
              required
              aria-required="true"
              aria-describedby="err_adresse"
              aria-invalid="false"
              autocomplete="street-address"
              pattern="^[0-9]+[a-zA-ZÀ-ÿ0-9 \-]+$"
            />
            <span class="err err_adresse" role="alert"></span>

            <label for="ville">Ville</label>
            <input
              class="border-2 border-black-500 p-2"
              type="text"
              id="ville"
              name="ville"
              required
              aria-required="true"
              aria-describedby="err_ville"
              aria-invalid="false"
              pattern="^[a-zA-ZÀ-ÿ0-9 '\-]+$"
            />
            <span class="err err_ville" role="alert"></span>

            <label for="province">Province</label>
            <input
              class="border-2 border-black-500 p-2"
              type="text"
              id="province"
              name="province"
              required
              aria-required="true"
              aria-describedby="err_province"
              aria-invalid="false"
              pattern="^[[\p{L}\s'\-]+]{2,}$"
            />
            <span class="err err_province" role="alert"></span>

            <label for="codePostal"
              >Code Postal <small>ex: A1A 1A1</small></label
            >
            <input
              class="border-2 border-black-500 p-2"
              type="text"
              id="codePostal"
              name="codePostal"
              required
              aria-required="true"
              aria-describedby="err_codePostal"
              aria-invalid="false"
              autocomplete="postal-code"
              pattern="([A-Z][0-9][A-Z] [0-9][A-Z][0-9]|[0-9]{5})"
            />
            <span class="err err_codePostal" role="alert"></span>
          </fieldset>

          <button
            type="button"
            id="etape1"
            class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded transition duration-200"
          >
            Suivant
          </button>
        </div>

        <!------------- Troisième Section: Détails de Paiement ------------->
        <div id="section2" class="flex flex-col gap-3">
          <h2 class="text-2xl font-bold m-4 text-center">
            Détails de Paiement
          </h2>
          <label for="numeroCarte">Numéro de la carte</label>
          <input
            class="border-2 border-black-500 p-2"
            type="texte"
            inputmode="numeric"
            pattern="^[0-9]{4}[ ]?[0-9]{4}[ ]?[0-9]{4}[ ]?[0-9]{4}$"
            id="numeroCarte"
            name="numeroCarte"
            required
            aria-required="true"
            aria-describedby="err_prenom"
            aria-invalid="false"
            autocomplete="cc-number"
          />
          <span class="err err_numeroCarte" role="alert"></span>

          <label for="dateExpirationCarte" class="font-bold"
            >Date d'expiration:
          </label>
          <label for="moisExpiration" class="sr-only">Mois</label>
          <select
            class="border-2 border-black-500 p-2 w-fit mr-2"
            id="moisExpiration"
            name="moisExpiration"
            aria-required="true"
            aria-describedby="err_moisExpiration"
            aria-invalid="false"
            required
          >
            <option value="" disabled selected>Choisir un mois</option>
            <option value="01">Janvier</option>
            <option value="02">Février</option>
            <option value="03">Mars</option>
            <option value="04">Avril</option>
            <option value="05">Mai</option>
            <option value="06">Juin</option>
            <option value="07">Juillet</option>
            <option value="08">Août</option>
            <option value="09">Septembre</option>
            <option value="10">Octobre</option>
            <option value="11">Novembre</option>
            <option value="12">Décembre</option>
          </select>
          <span class="err" id="err_moisExpiration" role="alert"></span>

          <label for="anneeExpiration" class="sr-only">Année</label>
          <select
            class="border-2 border-black-500 p-2 w-fit"
            id="anneeExpiration"
            name="anneeExpiration"
            aria-required="true"
            aria-describedby="err_anneeExpiration"
            aria-invalid="false"
            required
          >
            <option value="" disabled selected>Choisir une année</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>
            <option value="2031">2031</option>
            <option value="2032">2032</option>
            <option value="2033">2033</option>
            <option value="2034">2034</option>
            <option value="2035">2035</option>
          </select>
          <span class="err err_anneeExpiration" role="alert"></span>

          <label for="codeSecuriteCarte">Code de sécurité</label>
          <input
            class="border-2 border-black-500 p-2 w-15"
            type="text"
            inputmode="numeric"
            id="codeSecuriteCarte"
            name="codeSecuriteCarte"
            required
            aria-required="true"
            aria-describedby="err_codeSecuriteCarte"
            aria-invalid="false"
            autocomplete="cc-csc"
            pattern="[0-9][0-9][0-9]"
          />
          <span class="err err_codeSecuriteCarte" role="alert"></span>
          <br />

          <button
            type="button"
            id="etape2"
            class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded transition duration-200"
          >
            Suivant
          </button>
        </div>

        <!------------- Dernière Section: Validation ------------->
        <div id="section3">
          <h2 class="text-2xl font-bold m-4 text-center">Validation</h2>

          <input
            id="etape3"
            class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded transition duration-200"
            type="submit"
            value="Envoyer"
          /><br />
        </div>
      </form>
    </main>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
